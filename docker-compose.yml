services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nina
      POSTGRES_USER: nina
      POSTGRES_PASSWORD: nina
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://nina:nina@db:5432/nina
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - media:/app/media

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8000

volumes:
  pgdata:
  media:
